[package]
name = "aikoql-py"
description = "Python SDK for Aikoql Knowledge Kernel (PyO3) with LangGraph checkpointer spike"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_aikoql"
crate-type = ["cdylib"]

[dependencies]
aikoql-kernel = { path = "../../kernel" }
aikoql-storage = { path = "../../storage/aikoql" }
aikoql-storage-v2 = { path = "../../storage/aikoql-v2" }
aikoql-graph = { path = "../../engines/graph" }
aikoql-compiler = { path = "../../compiler" }
aikoql-runtime = { path = "../../runtime" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[features]
default = []
