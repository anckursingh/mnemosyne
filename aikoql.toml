# Aikoql Configuration
# Precedence: defaults < this file < environment (AIKOQL_*) < CLI flags.
# Auto-discovered at ./aikoql.toml (fallback /etc/aikoql/aikoql.toml — the
# Docker image ships it there). Override with --config PATH.

[storage]
# Storage backend: the default is "aikoql-v2" — a fresh path auto-creates its
# directory, while existing redb files, v1 WALs and snapshots still
# auto-detect. Name one explicitly to force a backend; unknown values are
# rejected at startup.
# backend = "redb"
# Path to the redb database file.
path = "./aikoql.redb"

[database]
# Deprecated: use [storage] above. Kept for backward compatibility; this
# section wins over [storage].path when both are set.
path = "./aikoql.redb"

[server]
# TCP listen address. Comment out for stdio mode (single client).
# listen = "127.0.0.1:9090"

# Prometheus metrics + health check HTTP endpoint. Comment out to disable.
# metrics_addr = "127.0.0.1:9091"

# TCP auth tokens (TOKEN[:TENANT[:ROLE1,ROLE2]]). Required with listen.
# Repeatable; alternatively one token via the AIKOQL_TCP_TOKEN env var or
# repeated --tcp-token flags.
# tcp_tokens = ["mytoken:acme:admin"]

[encryption]
# Enable encryption at rest (MRFC-0020). Whole-store values are encrypted with
# the master key; field-level policies encrypt the listed properties per type
# with per-tenant DEKs (see [encryption.policies]).
# First run: `aikoql keygen ./aikoql.key` (passphrase from AIKOQL_PASSPHRASE,
# else generated and printed once — save it). Wrong/missing passphrase fails
# the open; an encrypted database never silently opens as plaintext.
enabled = false

# Path to the master key file for the LocalKMS (v2 envelope, 88 bytes).
# key_path = "./aikoql.key"

# Passphrase for the LocalKMS key derivation (or set AIKOQL_PASSPHRASE env var,
# which wins). Never commit a real passphrase.
# passphrase = "change-me-in-production"

# Field-level encryption policies: type_name → properties encrypted on
# remember and decrypted on get. Unknown types are simply never matched.
# [encryption.policies]
# employee = ["salary", "ssn"]

[rate_limit]
# Enforced: 60s window — per connection on MCP tools/call (TCP + stdio) and
# per token on the REST surface (429 with the limit in the message).
enabled = true
# Maximum calls per minute per key. Process-local: N instances = N × limit.
max_calls_per_minute = 120

[embedding]
# Embedding provider for MATCH ... USING EMBEDDING queries.
# "candle" (default — local BERT inference, no network; requires
#   `aikoql model install` once), "http" (any OpenAI-compatible endpoint:
#   Ollama, OpenAI, etc. — uses /v1/embeddings), or "ollama" (alias of
#   "http"). Legacy "openai" is accepted with a deprecation warning.
provider = "candle"
# Base URL for OpenAI-compatible endpoint (omit /v1; default: Ollama localhost).
base_url = "http://localhost:11434"
# Model name. Candle: only all-MiniLM-L6-v2 ships (install others via
# `aikoql model install <model>`). OpenAI-compatible: endpoint model name.
model = "all-MiniLM-L6-v2"
# API key for remote services (omit for Ollama — no auth needed).
# api_key = "sk-..."

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log format: text, json
format = "text"
